name: Lighthouse CI

# Lighthouse audit of the 5 critical verified-skill.com pages, gated at
# >= 90 across all 4 Lighthouse categories (Performance, Accessibility,
# Best Practices, SEO) per spec AC-US21-01..05.
#
# verified-skill.com is built from the vskill-platform repo, not this one, so
# this workflow always audits a deployed site (production by default). The
# page URLs are passed on the command line: LHCI does not expand environment
# variables inside lighthouserc.json, which is why "${LHCI_BASE_URL}/" used to
# reach Lighthouse verbatim and fail with INVALID_URL.
#
# Triggers:
#   - PRs that change this workflow or its config
#   - workflow_dispatch (optionally against another base URL)
#   - schedule (nightly audit of production)
#
# Owner: 0829 Track D (ci-pipeline-agent), Track E AC-US21-*.

on:
  pull_request:
    paths:
      - '.github/workflows/lighthouse.yml'
      - '.github/lighthouserc.json'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to audit (default: production)'
        required: false
        default: 'https://verified-skill.com'
  schedule:
    # 06:00 UTC daily — well after any nightly deploy.
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI
        env:
          BASE_URL: ${{ inputs.base_url || 'https://verified-skill.com' }}
        run: |
          base="${BASE_URL%/}"
          case "$base" in
            https://*|http://*) ;;
            *) echo "::error::base_url must start with http:// or https://"; exit 1 ;;
          esac
          lhci autorun --config=.github/lighthouserc.json \
            --collect.url="$base/" \
            --collect.url="$base/desktop" \
            --collect.url="$base/ai-studio" \
            --collect.url="$base/studio" \
            --collect.url="$base/press"

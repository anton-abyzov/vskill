name: Desktop Release

# Triggered by tags like `desktop-v0.1.0`. Builds vSkill Desktop on macOS,
# Windows, and Linux runners; signs/notarizes per platform; uploads to
# Cloudflare R2 (`vskill-desktop` bucket → verified-skill.com/desktop/*);
# publishes a minisign-signed `latest.json` for the Tauri Updater plugin;
# creates a GitHub Release as a defense-in-depth mirror.
#
# Dry runs build and sign exactly like a release but never upload to R2,
# promote latest.json or create a GitHub release:
#   - pull requests from this repo that touch this workflow or scripts/release/**
#   - workflow_dispatch with dry_run (the default)
# A publishing dispatch (dry_run unticked) is only accepted on a desktop-v* tag.
# The one-command release is scripts/release/release-desktop.sh (RELEASING.md).
#
# Owner: 0829 Track D (ci-pipeline-agent)
# Spec ACs: AC-US13-01..06 (release pipeline), AC-US14-01..05 (updater + sig),
#           AC-US16-01..05 (manifest hosting), AC-US17-01..05 (changelog)
# Plan ref: .specweave/increments/0829-vskill-distribution-and-marketing/plan.md §7
# ADR ref:  .specweave/docs/internal/architecture/adr/0829-01-update-manifest-hosting.md

on:
  push:
    tags:
      - 'desktop-v*'
  pull_request:
    paths:
      - '.github/workflows/desktop-release.yml'
      - 'scripts/release/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign only (no R2 upload, no latest.json, no GitHub release)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # A newer push to the same PR cancels its older dry run. Tag runs are keyed
  # by their own tag and never cancel each other; publish has its own group.
  group: desktop-release-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # 'true' only for a real release: a desktop-v* tag push, or a dispatch on
  # such a tag with dry_run unticked. Everything else is a dry run.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)) }}

jobs:
  build:
    name: Build (${{ matrix.platform }})
    # Fork PRs get no secrets and must never run this workflow. Dependabot PRs
    # get only Dependabot secrets; dry-run those by dispatching on the branch.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
            platform: macos
            artifact: macos-14-artifacts
            apt_extra: ''
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            platform: windows
            artifact: windows-2022-artifacts
            apt_extra: ''
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
            platform: linux
            artifact: ubuntu-22.04-artifacts
            apt_extra: ''
          # The RPM bundle took ~320s on every release (gzip of the 130 MiB
          # sidecar payload) on the critical Linux leg. It is its own leg now;
          # publish still waits for it through `needs: build`.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: rpm
            platform: linux-rpm
            artifact: ubuntu-22.04-rpm-artifacts
            apt_extra: rpm
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the ancestry guard below needs origin/main.
          fetch-depth: 0

      - name: Refuse a publishing dispatch outside a desktop-v tag
        if: github.event_name == 'workflow_dispatch' && !inputs.dry_run && !startsWith(github.ref, 'refs/tags/desktop-v')
        shell: bash
        run: |
          echo "::error::dry_run=false is only allowed when dispatching on a desktop-v* tag (got ${GITHUB_REF})"
          exit 1

      - name: Refuse a tag that is not on main
        # There is no bump PR: CI stamps the version from the tag, so the tag
        # must point at a commit main already contains.
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::${GITHUB_REF_NAME} ($(git rev-parse HEAD)) is not an ancestor of origin/main. Tag a commit on main."
            exit 1
          fi
          echo "${GITHUB_REF_NAME} is on main."

      - name: Setup Node 22.23.3
        uses: actions/setup-node@v7
        with:
          # The SEA sidecar embeds this exact Node, so every leg pins one patch.
          node-version: '22.23.3'
          # npm cache is restored read-only below: tag and PR refs never save.
          package-manager-cache: false

      - name: Locate npm cache
        id: npm-cache
        shell: bash
        run: |
          # Same path and key as setup-node's own npm cache, so the entry that
          # main writes is the one restored here.
          PREFIX="node-cache-${RUNNER_OS}-$(node -p process.arch)-npm-"
          echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
          echo "prefix=${PREFIX}" >> "$GITHUB_OUTPUT"
          echo "key=${PREFIX}${{ hashFiles('package-lock.json') }}" >> "$GITHUB_OUTPUT"

      - name: Restore npm cache (read-only)
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ steps.npm-cache.outputs.key }}
          # A lockfile change since main's last save still restores most of it.
          restore-keys: ${{ steps.npm-cache.outputs.prefix }}

      - name: Setup Rust toolchain
        # Pinned: a floating stable changes the rust-cache key overnight and
        # every cache goes cold. Bump here and in notarize-dryrun.yml together.
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Restore Cargo cache (written on main by notarize-dryrun.yml)
        # A tag run can only read caches of its own ref and of main. The
        # nightly writes desktop-<target> on main. rust-cache hashes the
        # CARGO_*/RUST* env into the key, so keep that env identical there.
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}
          save-if: false

      - name: Install Linux build deps
        if: startsWith(matrix.platform, 'linux')
        run: |
          # Skip the man-db triggers (~20s); nothing here reads man pages.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          # gnupg ships with the runner image.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 ${{ matrix.apt_extra }}
          # minisign isn't in jammy main; download the prebuilt static binary
          MINISIGN_VERSION=0.12
          curl -fsSL "https://github.com/jedisct1/minisign/releases/download/${MINISIGN_VERSION}/minisign-${MINISIGN_VERSION}-linux.tar.gz" -o /tmp/minisign.tgz
          tar -xzf /tmp/minisign.tgz -C /tmp
          sudo install -m 0755 /tmp/minisign-linux/x86_64/minisign /usr/local/bin/minisign
          minisign -v

      - name: macOS — import Developer ID certificate
        if: matrix.platform == 'macos'
        env:
          BUILD_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          BUILD_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$BUILD_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/cert.p12

      - name: Install npm deps (no install scripts) + build studio bundle
        run: |
          npm ci --ignore-scripts
          npm run setup
          npm run build
          npm run build:eval-ui

      - name: Pre-flight — verify Tauri signing key is present
        # Without this guard, tauri-action silently builds bundles WITHOUT
        # .sig peers (the env var is optional from its perspective). That
        # breaks the Tauri Updater channel because there's nothing for
        # latest.json's `signature` field to reference. v1.0.12 shipped this
        # way; never again.
        shell: bash
        env:
          RAW_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${RAW_TAURI_SIGNING_PRIVATE_KEY}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is empty — auto-update bundles will be unsigned. Aborting."
            exit 1
          fi
          # 2026-05-09: every desktop CI before v1.0.18 failed at the
          # base64 decode step inside tauri-action with
          # `Invalid symbol 32, offset 9` — ASCII 32 is a SPACE. The
          # secret was set with whitespace/newlines that tauri-action's
          # base64 decoder rejects. Strip ALL whitespace before passing
          # the value downstream so the workflow is resilient to a
          # one-time misformatted upload.
          CLEAN_KEY="$(printf '%s' "${RAW_TAURI_SIGNING_PRIVATE_KEY}" | tr -d ' \t\r\n')"
          if [ "${#CLEAN_KEY}" -ne "${#RAW_TAURI_SIGNING_PRIVATE_KEY}" ]; then
            STRIPPED=$(( ${#RAW_TAURI_SIGNING_PRIVATE_KEY} - ${#CLEAN_KEY} ))
            echo "::warning::Stripped ${STRIPPED} whitespace char(s) from TAURI_SIGNING_PRIVATE_KEY before base64 decode."
          fi
          # Export the cleaned value to subsequent steps via GITHUB_ENV so
          # tauri-action receives the whitespace-free base64 instead of the
          # raw secret. Once whitespace is stripped it no longer equals the
          # secret, so the runner would not mask it on its own.
          echo "::add-mask::${CLEAN_KEY}"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY<<EOF_CLEAN_KEY"
            echo "${CLEAN_KEY}"
            echo "EOF_CLEAN_KEY"
          } >> "${GITHUB_ENV}"

      - name: Clean signing passphrase
        # Exports the whitespace-stripped passphrase through GITHUB_ENV. The
        # tauri-action step deliberately does not re-pull the raw secret.
        shell: bash
        env:
          P: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          CLEAN_P=$(printf '%s' "$P" | tr -d ' \t\r\n')
          if [ "${#CLEAN_P}" -ne "${#P}" ]; then
            STRIPPED=$(( ${#P} - ${#CLEAN_P} ))
            echo "::warning::Stripped ${STRIPPED} whitespace char(s) from TAURI_SIGNING_PRIVATE_KEY_PASSWORD."
          fi
          if [ -z "${CLEAN_P}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret is empty."
            exit 1
          fi
          # Mask the cleaned value too: it can differ from the raw secret.
          echo "::add-mask::${CLEAN_P}"
          {
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD<<EOF_CLEAN_P"
            echo "${CLEAN_P}"
            echo "EOF_CLEAN_P"
          } >> "${GITHUB_ENV}"

      - name: Probe updater signing key
        # Signs a probe file with the cleaned key + passphrase (from env, never
        # argv) through the repo's @tauri-apps/cli, the signer the bundler
        # uses. A bad key or passphrase fails here, before the compile, not at
        # the end of tauri-action. The Linux leg also verifies the signature
        # against plugins.updater.pubkey.
        shell: bash
        timeout-minutes: 3
        run: |
          set -euo pipefail
          PROBE_DIR=.updater-signing-probe
          rm -rf "$PROBE_DIR" && mkdir "$PROBE_DIR"
          echo "updater signing probe ${GITHUB_RUN_ID}" > "$PROBE_DIR/probe.txt"
          npx --no -- tauri signer sign "$PROBE_DIR/probe.txt" < /dev/null
          if [ ! -s "$PROBE_DIR/probe.txt.sig" ]; then
            echo "::error::tauri signer sign produced no signature"
            exit 1
          fi
          if [ "${{ matrix.platform }}" = "linux" ]; then
            python3 -c 'import base64, json, sys; sys.stdout.write(base64.b64decode(json.load(open("src-tauri/tauri.conf.json"))["plugins"]["updater"]["pubkey"]).decode())' > "$PROBE_DIR/updater.pub"
            base64 -d "$PROBE_DIR/probe.txt.sig" > "$PROBE_DIR/probe.txt.minisig"
            minisign -V -p "$PROBE_DIR/updater.pub" -m "$PROBE_DIR/probe.txt" -x "$PROBE_DIR/probe.txt.minisig"
          fi
          rm -rf "$PROBE_DIR"

      - name: Build sidecar (macOS/Linux)
        if: matrix.platform != 'windows'
        shell: bash
        env:
          # dist/ was built by the npm step above; skip tsc + vite here.
          SKIP_UPSTREAM_BUILD: '1'
        run: |
          if [ "${{ matrix.platform }}" = "macos" ]; then
            bash scripts/desktop/build-sidecar.sh
          else
            bash scripts/desktop/build-sidecar-linux.sh
          fi

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: pwsh -NoProfile -File scripts/desktop/build-sidecar-windows.ps1

      - name: Smoke the sidecar binary (boot, /api/health, /api/shutdown)
        # The release is only as good as a sidecar that actually starts.
        # v1.0.62 shipped a Windows sidecar that died with a SyntaxError
        # before printing LISTEN_PORT; nothing in this pipeline ever ran the
        # built exe. Fail the release here instead of on the user's desktop.
        shell: bash
        run: node scripts/desktop/smoke-sidecar.mjs --log-dir sidecar-smoke-logs

      - name: Upload sidecar smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-smoke-logs-${{ matrix.platform }}
          if-no-files-found: ignore
          path: sidecar-smoke-logs/

      - name: Derive desktop version from git tag + sync into Cargo.toml + tauri.conf.json
        # Git tag `desktop-v1.0.14` → version `1.0.14`. This decouples the
        # desktop release cadence from the npm CLI's `package.json` version
        # (which ships separately), and it is why a release needs no bump PR.
        # Dry runs keep the committed version.
        if: env.PUBLISH == 'true'
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#desktop-v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([\.\-].*)?$ ]]; then
            echo "::error::Tag '${TAG}' does not match desktop-vX.Y.Z; got VERSION='${VERSION}'"
            exit 1
          fi
          echo "Desktop version: ${VERSION}"
          # sed in-place — works on macOS (BSD) + Linux (GNU) when given empty
          # backup arg differently; use the portable -i.bak then rm pattern.
          sed -i.bak -E "s/^version = \"[^\"]+\"$/version = \"${VERSION}\"/" src-tauri/Cargo.toml && rm src-tauri/Cargo.toml.bak
          # tauri.conf.json — use python for reliable JSON edit
          python3 -c "import json,sys; p='src-tauri/tauri.conf.json'; d=json.load(open(p)); d['version']='${VERSION}'; json.dump(d, open(p,'w'), indent=2)"
          # Cargo.lock: move only the vskill-desktop entry. Never fall back to
          # re-resolving the whole lockfile at release time; that would ship
          # ~200 crate versions CI never tested.
          if ! (cd src-tauri && cargo update -p vskill-desktop --precise "${VERSION}"); then
            echo "::error::cargo update -p vskill-desktop --precise ${VERSION} failed"
            exit 1
          fi

      - name: Build Tauri app + sign + (macOS) notarize
        # tauri-action signs the update bundles using TAURI_SIGNING_PRIVATE_KEY
        # (minisign Ed25519 per ADR 0829-01 §2), codesigns and notarizes the
        # .app via APPLE_* on macOS, and emits .sig peers next to each bundle.
        #
        # Build only: with no tagName/releaseId, tauri-action uploads nothing.
        # The publish job creates the GitHub release once, after R2 succeeds
        # (this upload once failed every leg of v1.0.63 with 'Bad credentials').
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          # macOS codesigning + notarization (empty on the other legs)
          APPLE_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_ID || '' }}
          APPLE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ matrix.platform == 'macos' && secrets.APPLE_TEAM_ID || '' }}
          APPLE_CERTIFICATE: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ matrix.platform == 'macos' && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos' && secrets.APPLE_SIGNING_IDENTITY || '' }}
          # Tauri Updater minisign keypair (all platforms). We intentionally
          # do NOT re-pull the raw secrets here: the whitespace-stripped key
          # and passphrase come from GITHUB_ENV (pre-flight + passphrase steps
          # above). A step-level `${{ secrets.X }}` would override GITHUB_ENV;
          # v1.0.25 failed exactly that way.
          #
          # 0836 US-004: src-tauri/build.rs panics if GITHUB_OAUTH_CLIENT_ID
          # is unset or equals the placeholder `Iv1.placeholder-replace-before-ship`
          # for release builds — guards against shipping a binary that can never
          # complete the device-flow sign-in. The post-build verification step
          # below greps the compiled binary for the placeholder string as a
          # second-line check (defense-in-depth).
          #
          # Hardcoded here (not a secret) because OAuth App client IDs are
          # PUBLIC: device-flow leaks them in network traffic, and they're
          # baked into every shipped desktop binary at compile time. The
          # only thing that's secret is the OAuth App's client_secret, which
          # vskill does NOT use (device-flow is client-secret-less).
          # Source: Obsidian vault entry for "Github OAuth Auth token vskill
          # verified skill.md" (App: vskill, app id 3406130, anton.abyzov@gmail.com).
          GITHUB_OAUTH_CLIENT_ID: Ov23li6H8OpvPfuhyDEt
        with:
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Verify .sig peer files were generated
        # Defensive — if tauri-action exited 0 but no .sig file landed next
        # to the bundle, something is silently wrong with the signing config
        # and we should not silently ship an unsigned release.
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "::error::expected bundle dir not found: $BUNDLE_DIR"
            exit 1
          fi
          require_any_sig() {
            local label="$1"
            shift
            local pattern
            for pattern in "$@"; do
              if compgen -G "$pattern" > /dev/null; then
                echo "Found signed $label artifact matching: $pattern"
                return 0
              fi
            done
            echo "::error::missing .sig peer for $label"
            for pattern in "$@"; do
              echo "::error::  tried: $pattern"
            done
            return 1
          }

          case "${{ matrix.platform }}" in
            macos)
              require_any_sig "macOS updater bundle" \
                "$BUNDLE_DIR/macos"/*.app.tar.gz.sig
              ;;
            windows)
              require_any_sig "Windows NSIS installer" \
                "$BUNDLE_DIR/nsis"/*-setup.exe.sig \
                "$BUNDLE_DIR/nsis"/*-setup.nsis.zip.sig
              require_any_sig "Windows MSI installer" \
                "$BUNDLE_DIR/msi"/*.msi.sig \
                "$BUNDLE_DIR/msi"/*.msi.zip.sig
              ;;
            linux)
              require_any_sig "Linux AppImage" \
                "$BUNDLE_DIR/appimage"/*.AppImage.sig \
                "$BUNDLE_DIR/appimage"/*.AppImage.tar.gz.sig
              ;;
            linux-rpm)
              # Not an updater bundle; require only that the package exists.
              if ! compgen -G "$BUNDLE_DIR/rpm/*.rpm" > /dev/null; then
                echo "::error::no .rpm bundle under $BUNDLE_DIR/rpm"
                exit 1
              fi
              ;;
            *)
              echo "::error::unknown platform ${{ matrix.platform }}"
              exit 1
              ;;
          esac
          echo "All expected bundles present for ${{ matrix.platform }}."

      - name: Notarize + staple the DMG (macOS)
        # tauri-action notarizes and staples the .app only, so the DMG users
        # download stayed 'Unnotarized Developer ID'. Uses the same Apple ID
        # credential as tauri-action: one credential path, no keychain profile.
        if: matrix.platform == 'macos'
        shell: bash
        timeout-minutes: 35
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_WAIT_TIMEOUT: 30m
        run: |
          set -euo pipefail
          shopt -s nullglob
          DMGS=(src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg)
          if [ "${#DMGS[@]}" -ne 1 ]; then
            echo "::error::expected exactly one DMG, found ${#DMGS[@]}"
            exit 1
          fi
          bash scripts/release/notarize-macos.sh "${DMGS[0]}"

      - name: Verify code signing + notarization (macOS)
        # Gating: each check fails the job; nothing here may fail softly.
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          BUNDLE="src-tauri/target/${{ matrix.target }}/release/bundle"
          APPS=("$BUNDLE"/macos/*.app)
          DMGS=("$BUNDLE"/dmg/*.dmg)
          if [ "${#APPS[@]}" -ne 1 ] || [ "${#DMGS[@]}" -ne 1 ]; then
            echo "::error::expected one .app and one .dmg (found ${#APPS[@]} and ${#DMGS[@]})"
            exit 1
          fi
          APP="${APPS[0]}"
          DMG="${DMGS[0]}"
          # assess <path> <spctl flags...>: spctl must accept the path AND
          # report it as notarized.
          assess() {
            local target="$1" out
            shift
            if ! out="$(spctl "$@" "$target" 2>&1)"; then
              echo "$out"
              echo "::error::spctl rejected $target"
              return 1
            fi
            echo "$out"
            case "$out" in
              *"source=Notarized Developer ID"*) ;;
              *) echo "::error::spctl did not report 'Notarized Developer ID' for $target"; return 1 ;;
            esac
          }
          codesign --verify --deep --strict --verbose=2 "$APP"
          xcrun stapler validate "$APP"
          assess "$APP" -a -t exec -vv
          codesign --verify --strict --verbose=2 "$DMG"
          xcrun stapler validate "$DMG"
          assess "$DMG" -a -t open --context context:primary-signature -vv

      - name: 0836 US-004 — assert no placeholder client_id in release binary
        # Defense-in-depth alongside src-tauri/build.rs: even if a future
        # change bypasses build.rs (edited locally, vendored release, etc.),
        # `strings | grep` against the signed binary catches the placeholder.
        # v1.0.17 shipped the placeholder; this gate ensures it never
        # happens again. We grep ONLY the host-platform binary path because
        # `strings` semantics differ across runners — the macOS binary is
        # the canonical artifact users ship, so we check there as the
        # source of truth.
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BIN_GLOB="src-tauri/target/${{ matrix.target }}/release/bundle/macos"/*.app/Contents/MacOS/*
          shopt -s nullglob
          BINS=( $BIN_GLOB )
          if [ "${#BINS[@]}" -eq 0 ]; then
            echo "::error::no signed binary found at $BIN_GLOB"
            exit 1
          fi
          PLACEHOLDER='Iv1.placeholder-replace-before-ship'
          FAIL=0
          for BIN in "${BINS[@]}"; do
            echo "Scanning: $BIN"
            if strings "$BIN" | grep -q -F "$PLACEHOLDER"; then
              echo "::error::Placeholder GITHUB_OAUTH_CLIENT_ID found in $BIN"
              FAIL=1
            fi
          done
          if [ "$FAIL" -eq 1 ]; then exit 1; fi
          echo "OK: placeholder string absent from all release binaries."

      - name: GPG sign Linux artifacts
        if: startsWith(matrix.platform, 'linux')
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_FPR: ${{ secrets.GPG_KEY_FPR }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          bash scripts/release/sign-linux-artifacts.sh src-tauri/target/${{ matrix.target }}/release/bundle/

      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.zip.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.nsis.zip
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.nsis.zip.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb.asc
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm.asc
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.asc
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage.tar.gz.sig

  publish:
    name: Publish to R2 + GitHub Release
    needs: build
    # Real releases only. Dry runs (PRs, dispatch with dry_run) stop after the
    # builds: no R2 upload, no latest.json promotion, no GitHub release.
    if: >-
      startsWith(github.ref, 'refs/tags/desktop-v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry_run))
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: write
    # One latest.json promotion at a time; publish-manifest.sh also refuses
    # to replace a newer live version.
    concurrency:
      group: desktop-release-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./release-artifacts/

      - name: Check preinstalled tools + install git-cliff
        run: |
          # ubuntu-22.04 images ship AWS CLI v2 and jq; no apt install needed.
          aws --version
          jq --version
          curl -sSL https://github.com/orhun/git-cliff/releases/download/v2.6.1/git-cliff-2.6.1-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /tmp
          sudo install /tmp/git-cliff-2.6.1/git-cliff /usr/local/bin/git-cliff

      - name: Generate release notes
        run: bash scripts/release/release-notes.sh "${{ github.ref_name }}"

      - name: Publish to Cloudflare R2 + atomic latest.json
        env:
          # Must match the macOS build matrix target. Generic .app.tar.gz is ARM only.
          MACOS_ARCH: aarch64
          CLOUDFLARE_R2_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
        run: |
          # Strip the desktop-v prefix → semver only.
          VERSION="${GITHUB_REF_NAME#desktop-v}"
          bash scripts/release/publish-manifest.sh "$VERSION" ./release-artifacts/

      - name: Create / update GitHub Release (mirror)
        # The only place the GitHub release is created, after R2 succeeded.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          name: 'vSkill Desktop ${{ github.ref_name }}'
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.app.tar.gz
            release-artifacts/**/*.msi
            release-artifacts/**/*-setup.exe
            release-artifacts/**/*.deb
            release-artifacts/**/*.rpm
            release-artifacts/**/*.AppImage
            release-artifacts/**/*.asc
            release-artifacts/**/*.sig

  timing:
    name: Release timing report
    needs: [build, publish]
    # Warn-only: per-job and per-step durations against the last successful
    # releases and fixed budgets (scripts/release/timing-report.mjs).
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' ||
       (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'))
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release

      - name: Timing report
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          node scripts/release/timing-report.mjs
          --repo "$GITHUB_REPOSITORY"
          --run "$GITHUB_RUN_ID"
          --workflow desktop-release.yml
          --event push

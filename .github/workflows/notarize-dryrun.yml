name: Desktop Build (nightly)

# Nightly release-profile build of all three desktop platforms from main, so
# a broken toolchain, bundler download or notary flow shows up the night it
# breaks instead of at minute 10 of a release:
#   - macOS: build, notarize + staple the DMG (scripts/release/macos-build.sh,
#     same Apple ID credential as desktop-release.yml), alert when
#     notarization stalls > 4h (NFR-17).
#   - Linux + Windows: the same `tauri build` the release runs, without any
#     signing secret (updater artifacts off).
#
# It is also the only writer of the Rust caches desktop-release.yml restores
# on tag builds (shared-key desktop-<target>; tags can read main's caches).
# Keep the toolchain pin and the CARGO_*/RUST* env identical to the release:
# rust-cache hashes them into the key.
#
# A push to main that touches src-tauri/** runs only the Linux and Windows
# legs: it refreshes their caches without a notary submission per push.
#
# Owner: 0829 Track D (ci-pipeline-agent), AC NFR-17.

on:
  schedule:
    # 03:00 UTC ≈ 22:00 ET — runs after Anton's normal work day.
    - cron: '0 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - '.github/workflows/notarize-dryrun.yml'

permissions:
  contents: read

concurrency:
  # A newer push supersedes an older push run; scheduled runs never cancel.
  group: desktop-nightly-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  macos:
    name: Build + notarize (macos)
    if: github.event_name != 'push'
    runs-on: macos-14
    timeout-minutes: 300  # 5h hard ceiling — we alert at 4h.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22.23.3
        uses: actions/setup-node@v7
        with:
          # Same patch as desktop-release.yml (the SEA sidecar embeds it).
          node-version: '22.23.3'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: aarch64-apple-darwin

      - name: Cache Cargo (read by desktop-release.yml)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-aarch64-apple-darwin
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Import Developer ID certificate
        env:
          BUILD_CERT_BASE64: ${{ secrets.APPLE_CERTIFICATE }}
          BUILD_CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$BUILD_CERT_BASE64" | base64 --decode > /tmp/cert.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$BUILD_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k actions build.keychain
          rm -f /tmp/cert.p12

      - name: npm install (no install scripts) + studio bundle
        run: |
          npm ci --ignore-scripts
          npm run setup
          npm run build
          npm run build:eval-ui

      - name: Build sidecar
        env:
          # dist/ was built by the previous step; skip tsc + vite here.
          SKIP_UPSTREAM_BUILD: '1'
        run: bash scripts/desktop/build-sidecar.sh

      - name: Build Tauri (smoke mode — notarize via build script)
        env:
          # One credential path, the release's: notarize-macos.sh uses the
          # Apple ID when all three are set (no keychain profile).
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Mirror desktop-release.yml: it ships an aarch64-apple-darwin bundle,
          # and build-sidecar.sh only produces the host-arch sidecar, so a
          # universal build has no vskill-server-universal-apple-darwin to embed.
          MACOS_BUILD_TARGET: aarch64-apple-darwin
          # This canary checks codesign + notarization, not updater signing,
          # and has no TAURI_SIGNING_PRIVATE_KEY; skip the .tar.gz/.sig artifacts.
          MACOS_BUILD_NO_UPDATER: '1'
          # build.rs refuses release builds without a real OAuth App client_id.
          # Public value, same as desktop-release.yml.
          GITHUB_OAUTH_CLIENT_ID: Ov23li6H8OpvPfuhyDEt
        run: |
          START=$(date +%s)
          bash scripts/release/macos-build.sh --notarize
          END=$(date +%s)
          DURATION=$((END - START))
          echo "NOTARIZE_DURATION_SECONDS=$DURATION" >> $GITHUB_ENV
          echo "==> Notarize duration: $DURATION seconds ($((DURATION / 60)) min)"

      - name: Alert on slow build (>15 min) or stall (>4h)
        if: env.NOTARIZE_DURATION_SECONDS != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DURATION="$NOTARIZE_DURATION_SECONDS"
          BUDGET=900       # 15 min: build + notarize normally takes 6-9 min
          THRESHOLD=14400  # 4h in seconds
          if (( DURATION > BUDGET )); then
            echo "::warning::Build + notarize took ${DURATION}s (budget ${BUDGET}s)"
          fi
          if (( DURATION > THRESHOLD )); then
            echo "::warning::Notarization took ${DURATION}s (> 4h threshold)"
            BODY_FILE=$(mktemp)
            {
              echo "Nightly notarize-dryrun took $((DURATION / 60)) minutes (>4h threshold per NFR-17)."
              echo ""
              echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              echo ""
              echo "Action items:"
              echo "- Check Apple's System Status (https://developer.apple.com/system-status/) for notary outages."
              echo "- If green there, file feedback at https://feedbackassistant.apple.com."
              echo "- Disable scheduled releases until duration recovers."
            } > "$BODY_FILE"
            gh issue create \
              --title "Notarization stall: ${DURATION}s on $(date -u +%Y-%m-%d)" \
              --body-file "$BODY_FILE" \
              --label "ops,desktop-release,p1" \
              --repo "$GITHUB_REPOSITORY"
          fi

  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm,appimage
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22.23.3
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.3'
          cache: 'npm'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Cache Cargo (read by desktop-release.yml)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          shared-key: desktop-${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux build deps
        if: matrix.platform == 'linux'
        run: |
          # Skip the man-db triggers (~20s); nothing here reads man pages.
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libfuse2 rpm

      - name: Install npm deps (no install scripts) + build studio bundle
        run: |
          npm ci --ignore-scripts
          npm run setup
          npm run build
          npm run build:eval-ui

      - name: Build sidecar (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: bash scripts/desktop/build-sidecar-linux.sh

      - name: Build sidecar (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: pwsh -NoProfile -File scripts/desktop/build-sidecar-windows.ps1

      - name: Smoke the sidecar binary (boot, /api/health, /api/shutdown)
        shell: bash
        run: node scripts/desktop/smoke-sidecar.mjs --log-dir sidecar-smoke-logs

      - name: Upload sidecar smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-smoke-logs-${{ matrix.platform }}
          if-no-files-found: ignore
          path: sidecar-smoke-logs/

      - name: Build Tauri (release build, no updater signing)
        # Same target, bundles and client id as the release leg, so the
        # dependency artifacts this job caches are the ones a tag build needs.
        # The --config override only reaches the app crate's build script.
        shell: bash
        env:
          GITHUB_OAUTH_CLIENT_ID: Ov23li6H8OpvPfuhyDEt
        run: >-
          npx --no -- tauri build
          --target ${{ matrix.target }}
          --bundles ${{ matrix.bundles }}
          --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Verify the bundles were produced
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.platform }}" in
            windows) patterns="msi/*.msi nsis/*-setup.exe" ;;
            linux)   patterns="deb/*.deb rpm/*.rpm appimage/*.AppImage" ;;
            *) echo "::error::unknown platform ${{ matrix.platform }}"; exit 1 ;;
          esac
          for p in $patterns; do
            if ! compgen -G "$BUNDLE_DIR/$p" > /dev/null; then
              echo "::error::no bundle matching $BUNDLE_DIR/$p"
              exit 1
            fi
            echo "OK: $(compgen -G "$BUNDLE_DIR/$p" | head -1)"
          done

  timing:
    name: Release timing report
    needs: [macos, build]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/release

      - name: Timing report
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
        run: >-
          node scripts/release/timing-report.mjs
          --repo "$GITHUB_REPOSITORY"
          --run "$GITHUB_RUN_ID"
          --workflow notarize-dryrun.yml
          --event "$EVENT"

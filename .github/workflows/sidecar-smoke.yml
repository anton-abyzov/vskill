name: Sidecar Smoke

# Builds the Node SEA sidecar exactly the way desktop-release.yml does on all
# three desktop platforms and then RUNS it (scripts/desktop/smoke-sidecar.mjs):
# LISTEN_PORT within 15 s, GET /api/health == 200, POST /api/shutdown, clean
# exit. This is the gate that was missing when v1.0.62 shipped a Windows
# sidecar that died with a SyntaxError before announcing its port.
#
# The rust-windows job compiles + runs the src-tauri tests on windows-latest
# (the cfg(windows) process-control code in src-tauri/src/proc.rs cannot be
# compiled on macOS/Linux).
#
# push to main (same paths) exists so rust-windows writes the one shared Rust
# cache that PR runs restore; PR runs never save their own.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/desktop/**'
      - 'src/eval-server/**'
      - 'src-tauri/**'
      - '.github/workflows/sidecar-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/desktop/**'
      - 'src/eval-server/**'
      - 'src-tauri/**'
      - '.github/workflows/sidecar-smoke.yml'

permissions:
  contents: read

# A newer push to a PR cancels its older run; runs on main are kept.
concurrency:
  group: sidecar-smoke-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  sidecar-smoke:
    name: Sidecar runtime smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          # Same patch on every OS: the SEA sidecar embeds the host node binary.
          node-version: '22.23.3'
          # SEA injects into the host node binary; the Windows sidecar is x64.
          architecture: ${{ runner.os == 'Windows' && 'x64' || '' }}
          cache: npm

      - name: Install deps (no install scripts) + rebuild esbuild
        # `--ignore-scripts` keeps third-party postinstall hooks out of CI
        # (supply-chain posture; .npmrc pins ignore-scripts=true). esbuild is the
        # only dependency whose install script is required for the build, so
        # `npm run setup` rebuilds it with --ignore-scripts=false; fsevents is
        # macOS-only file watching and ships prebuilt.
        shell: bash
        run: |
          node -p "process.arch + ' ' + process.version"
          npm ci --ignore-scripts
          npm run setup
          node -p "require('esbuild').version"

      - name: Build upstream artifacts (tsc + eval-ui)
        shell: bash
        run: |
          npm run build
          npm run build:eval-ui

      - name: Build sidecar (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: pwsh -NoProfile -File scripts/desktop/build-sidecar-windows.ps1

      - name: Build sidecar (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: bash scripts/desktop/build-sidecar.sh

      - name: Build sidecar (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          SKIP_UPSTREAM_BUILD: '1'
        run: bash scripts/desktop/build-sidecar-linux.sh

      - name: Runtime smoke (LISTEN_PORT, /api/health, /api/shutdown)
        shell: bash
        run: node scripts/desktop/smoke-sidecar.mjs --log-dir smoke-logs

      - name: Upload smoke logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: sidecar-smoke-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            smoke-logs/
            dist/sidecar/sea-config.json

  rust-windows:
    name: cargo test src-tauri (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: 1.99.1
          targets: x86_64-pc-windows-msvc

      # One cache for every ref: main writes it, PRs and branches only read it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target
          shared-key: rust-windows-debug
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # tauri-build (build.rs) copies bundle.externalBin
      # (src-tauri/binaries/vskill-server-x86_64-pc-windows-msvc.exe) and
      # generate_context! embeds frontendDist (../dist/eval-ui); both must
      # exist or the crate does not compile. No Rust test reads either file, so
      # stubs are enough here; the real sidecar is built and run by the
      # sidecar-smoke job above. Debug profile => build.rs does not require
      # GITHUB_OAUTH_CLIENT_ID. WebView2 + MSVC are preinstalled on windows
      # runners.
      - name: Stub frontend + sidecar (prerequisites for tauri-build)
        shell: bash
        run: |
          mkdir -p dist/eval-ui src-tauri/binaries
          printf '<!doctype html><title>stub</title>\n' > dist/eval-ui/index.html
          : > src-tauri/binaries/vskill-server-x86_64-pc-windows-msvc.exe

      # One cargo test covers what the old cargo check step did: src-tauri has
      # no cfg(not(test)) code, and check's metadata was never reused by test.
      - name: cargo test
        # Pure-Rust unit tests (no window is created); runs headless fine.
        shell: bash
        working-directory: src-tauri
        env:
          CARGO_TERM_COLOR: always
          RUST_BACKTRACE: '1'
        run: cargo test --locked -- --nocapture

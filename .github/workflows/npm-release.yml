name: npm Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# contents: write for `gh release create`; actions: read to find and watch the
# CI run on the tagged commit.
permissions:
  contents: write
  actions: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Match the package to the release tag
        run: node -e 'const p=require("./package.json");if(process.env.GITHUB_REF_NAME!==`v${p.version}`)throw new Error("Tag and package version differ")'
      - run: npm ci --ignore-scripts && npm run setup
      # This release does not re-run the test suite. It relies on ci.yml, whose
      # sharded unit-full jobs run the whole Vitest suite (plus the cross-OS
      # smoke jobs) on every push to main, and waits for that run on the tagged
      # commit to pass. If ci.yml ever stops running the full suite on push to
      # main, put `npm test` back here. A tag on a commit with no CI push run
      # (not on main, or [skip ci]) falls back to running the suite here.
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
          PWDEBUG: '0'
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          set -euo pipefail
          run_id=""
          for _ in $(seq 1 18); do
            run_id=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
              --event push --json databaseId -q '.[0].databaseId // empty')
            [ -n "$run_id" ] && break
            sleep 5
          done
          if [ -n "$run_id" ]; then
            echo "Waiting for CI run $run_id on $GITHUB_SHA"
            gh run watch "$run_id" -R "$GITHUB_REPOSITORY" --exit-status --interval 10
          else
            echo "::warning::No ci.yml push run for $GITHUB_SHA after 90s; running the full suite here"
            npm test -- --maxWorkers=4
          fi
      # `npm run release` = `npm publish --ignore-scripts=false`, so
      # prepublishOnly builds dist/ and the eval-ui bundle, syncs the README
      # badges and runs release:preflight before anything is uploaded.
      - name: Publish the validated package
        run: npm run release -- --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create release notes
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}

name: Nightly Health

# Keeps one open issue per watched workflow while it is red on main, so a
# nightly that starts failing is visible the next morning instead of on
# release day. Failure: open the issue "<workflow> red on main" (label
# nightly-red) or comment on it with the run URL and the first ##[error]
# line. Success: comment and close it, unless the run skipped jobs (a push
# run of Desktop Build skips macOS); then a full run has to pass first.
#
# workflow_run only fires for this file as it exists on the default branch,
# and the names below must match each workflow's `name:` exactly.

on:
  workflow_run:
    workflows:
      - "Desktop Build (nightly)"
      - "E2E Live (nightly)"
      - "E2E Lifecycle (nightly)"
      - "Golden Path (regression)"
      - "Lighthouse CI"
      - "Sidecar Smoke"
    types: [completed]

permissions: {}

concurrency:
  # One updater per watched workflow at a time, so two runs finishing
  # together cannot open duplicate issues.
  group: nightly-health-${{ github.event.workflow_run.workflow_id }}
  cancel-in-progress: false

jobs:
  track:
    name: Track ${{ github.event.workflow_run.name }}
    if: >-
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.event != 'pull_request' &&
      contains(fromJSON('["success","failure","timed_out","startup_failure"]'), github.event.workflow_run.conclusion)
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      WF_NAME: ${{ github.event.workflow_run.name }}
      WF_ID: ${{ github.event.workflow_run.workflow_id }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_URL: ${{ github.event.workflow_run.html_url }}
      RUN_EVENT: ${{ github.event.workflow_run.event }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      CONCLUSION: ${{ github.event.workflow_run.conclusion }}
    steps:
      - name: Open, update or close the tracking issue
        run: |
          set -euo pipefail
          TITLE="${WF_NAME} red on main"

          # An older run that finishes after a newer one must not reopen or
          # close the issue: act only for the newest decided main run.
          # Cancelled and skipped runs say nothing about main; look past them.
          LATEST=$(gh run list --workflow "$WF_ID" --branch main --status completed \
            --limit 30 --json databaseId,event,conclusion \
            -q '[.[] | select(.event != "pull_request")
                     | select(.conclusion == "success" or .conclusion == "failure" or .conclusion == "timed_out" or .conclusion == "startup_failure")][0].databaseId')
          if [ "$LATEST" != "$RUN_ID" ]; then
            echo "Run $RUN_ID is not the newest decided main run ($LATEST); nothing to do."
            exit 0
          fi

          gh label create nightly-red --color B60205 \
            --description "A nightly or main-branch workflow is failing" --force

          NUMBER=$(gh issue list --label nightly-red --state open --limit 100 \
            --json number,title \
            | jq -r --arg t "$TITLE" '[.[] | select(.title == $t)][0].number // empty')

          if [ "$CONCLUSION" = "success" ]; then
            if [ -z "$NUMBER" ]; then
              echo "$WF_NAME is green on main and no issue is open."
              exit 0
            fi
            # A run that skipped jobs did not exercise everything (Desktop
            # Build's push runs skip macOS), so it cannot close an issue a
            # full run opened. The next full run closes it.
            SKIPPED=$(gh run view "$RUN_ID" --json jobs \
              -q '[.jobs[] | select(.conclusion == "skipped")] | length')
            if [ "$SKIPPED" != "0" ]; then
              echo "Run $RUN_ID passed but skipped $SKIPPED job(s); #$NUMBER stays open until a full run passes."
              exit 0
            fi
            gh issue comment "$NUMBER" --body "Green again on main: $RUN_URL"
            gh issue close "$NUMBER" --reason completed
            echo "Closed #$NUMBER."
            exit 0
          fi

          # Diagnostics only: the issue is still opened or updated when the
          # failed-step log is unavailable (expired, startup_failure).
          ERROR_LINE=""
          if gh run view "$RUN_ID" --log-failed > failed.log 2> view.err; then
            ERROR_LINE=$(sed -n '/##\[error\]/{p;q;}' failed.log | cut -c1-500)
          else
            echo "::warning::could not read the failed-step log: $(head -c 300 view.err)"
          fi
          [ -n "$ERROR_LINE" ] || ERROR_LINE="(no ##[error] line in the failed-step log)"

          BODY=body.md
          {
            echo "**${WF_NAME}** finished \`${CONCLUSION}\` on main."
            echo ""
            echo "- Run: ${RUN_URL}"
            echo "- Commit: ${HEAD_SHA}"
            echo "- Trigger: ${RUN_EVENT}"
            echo ""
            echo "First error:"
            echo ""
            # Indented, so the log text renders as code and cannot add markup.
            printf '    %s\n' "$ERROR_LINE"
          } > "$BODY"

          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body-file "$BODY"
            echo "Commented on #$NUMBER."
          else
            echo "" >> "$BODY"
            echo "Closed automatically by nightly-health.yml when this workflow next passes on main." >> "$BODY"
            gh issue create --title "$TITLE" --label nightly-red --body-file "$BODY"
          fi
